version: '3.8'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: mcp_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  init-index:
    build: .
    container_name: mcp_init_index
    environment:
      - ES_URL=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    volumes:
      - ./data:/app/data
    command: ["python", "src/init_system.py"]

  web:
    build: .
    container_name: mcp_advisor_ui
    ports:
      - "8501:8501"
    environment:
      - ES_URL=http://elasticsearch:9200
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      init-index:
        condition: service_completed_successfully
    volumes:
      - ./data:/app/data

volumes:
  es_data:
